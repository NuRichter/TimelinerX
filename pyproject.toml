[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timelinerx"
version = "1.0.0"
description = "Local-first desktop app that turns Google Timeline exports into cinematic animated map videos."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "NuRichter Workspace" }]
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.4.4",
    "Pillow==12.2.0",
    "python-dateutil==2.9.0.post0",
    "psutil==7.2.2",
    "platformdirs==4.9.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "scipy==1.17.1", "pyinstaller==6.22.3"]

[project.scripts]
timelinerx = "timelinerx.cli.main:main"

[project.gui-scripts]
timelinerx-gui = "timelinerx.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timelinerx = ["i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["default::UserWarning"]
